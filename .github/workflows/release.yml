name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      release_notes:
        description: Release notes (leave empty to auto-generate from commits)
        type: string
        required: false

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run check

      - run: npm audit --omit=dev

      - name: Prepare version commit and tag
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          npm version "$VERSION_BUMP" --no-git-tag-version
          VERSION="$(jq -r .version package.json)"
          TAG="v$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git reset --hard
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "$TAG"
            test "$(git rev-parse "$TAG^")" = "$GITHUB_SHA"
            test "$(jq -r .version package.json)" = "$VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION"
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          PACKAGE_NAME="$(jq -r .name package.json)"
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release"
          elif [ -n "$RELEASE_NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes "$RELEASE_NOTES"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
